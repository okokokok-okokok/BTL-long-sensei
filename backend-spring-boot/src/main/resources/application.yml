server:
  port: 8080
  servlet:
    context-path: /api/v1

spring:
  application:
    name: ptit-student-service
  datasource:
    url: jdbc:h2:mem:ptitdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
